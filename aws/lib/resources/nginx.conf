error_log  /var/www/Livais-backend/log/nginx.error.log;
access_log /var/www/Livais-backend/log/nginx.access.log;

client_max_body_size 2G;
upstream web-app {
  server 127.0.0.1:3000;
}
server {
  listen 443;  # 443: https, 80: http
  server_name *************; # 作成したEC2の ElasticIPアドレス。
  keepalive_timeout 5;
  root /var/www/Livais-backend/public;
  try_files $uri/index.html $uri.html $uri @app;
  location @app {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_pass http://web-app;
  }

  error_page 500 502 503 504 /500.html;
  location = /500.html {
      root /var/www/Livais-backend/public;
  }
}